name: "Build and Deploy to GKE"

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      project_id:
        description: 'GCP project ID'
        required: false
      gke_cluster:
        description: 'GKE cluster name'
        required: false
      gke_zone:
        description: 'GKE zone or location'
        required: false
      deployment_name:
        description: 'Kubernetes deployment name'
        required: false
      workload_identity_provider:
        description: 'Workload Identity Provider'
        required: false

env:
  PROJECT_ID: ${{ github.event.inputs.project_id || secrets.GCP_PROJECT_ID }}
  GAR_LOCATION: 'us-central1'
  GKE_CLUSTER: ${{ github.event.inputs.gke_cluster || secrets.GKE_CLUSTER }}
  GKE_ZONE: ${{ github.event.inputs.gke_zone || secrets.GKE_ZONE }}
  DEPLOYMENT_NAME: ${{ github.event.inputs.deployment_name || secrets.DEPLOYMENT_NAME }}
  REPOSITORY: 'samples'
  IMAGE: 'static-site'
  WORKLOAD_IDENTITY_PROVIDER: ${{ github.event.inputs.workload_identity_provider || secrets.WORKLOAD_IDENTITY_PROVIDER }}

jobs:
  setup-build-publish-deploy:
    name: Setup, Build, Publish, and Deploy
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate required environment variables
        run: |
          missing=0
          for var in PROJECT_ID GKE_CLUSTER GKE_ZONE DEPLOYMENT_NAME WORKLOAD_IDENTITY_PROVIDER; do
            if [ -z "${!var}" ]; then
              echo "ERROR: $var is not set"
              missing=1
            fi
          done
          if [ "$missing" -eq 1 ]; then
            exit 1
          fi

      - id: auth
        name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.WORKLOAD_IDENTITY_PROVIDER }}

      - name: Docker Auth
        uses: docker/login-action@v3
        with:
          username: oauth2accesstoken
          password: ${{ steps.auth.outputs.access_token }}
          registry: ${{ env.GAR_LOCATION }}-docker.pkg.dev

      - name: Set up GKE credentials
        uses: google-github-actions/get-gke-credentials@v2
        with:
          cluster_name: ${{ env.GKE_CLUSTER }}
          location: ${{ env.GKE_ZONE }}
          project_id: ${{ env.PROJECT_ID }}

      - name: Build and push Docker container
        run: |
          DOCKER_TAG="${GAR_LOCATION}-docker.pkg.dev/${PROJECT_ID}/${REPOSITORY}/${IMAGE}:${GITHUB_SHA}"
          docker build \
            --tag "${DOCKER_TAG}" \
            --build-arg GITHUB_SHA="${GITHUB_SHA}" \
            --build-arg GITHUB_REF="${GITHUB_REF}" \
            .
          docker push "${DOCKER_TAG}"
          echo "IMAGE=${DOCKER_TAG}" >> $GITHUB_ENV

      - name: Install Kustomize
        run: |
          curl -sL "https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize/v5.4.3/kustomize_v5.4.3_linux_amd64.tar.gz" -o kustomize.tar.gz
          tar -xzf kustomize.tar.gz
          chmod +x kustomize
          sudo mv kustomize /usr/local/bin/

      - name: Deploy to GKE
        run: |
          kustomize edit set image ${IMAGE}=${GAR_LOCATION}-docker.pkg.dev/${PROJECT_ID}/${REPOSITORY}/${IMAGE}:${GITHUB_SHA}
          kustomize build . | kubectl apply -f -
          kubectl rollout status deployment/${DEPLOYMENT_NAME}
          kubectl get services -o wide
